[project]
name = "ltx-testing"
version = "0.1.0"
description = "Benchmark LTX-2.5 video generation (bf16 / fp8 / int8, native ltx-pipelines vs ComfyUI) on Modal GPUs, with an outfit try-on 360-degree turn workload."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6.4",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "av>=19.0.2",
    "scikit-image>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
